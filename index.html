<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Electro Man</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky nav, hash-routed views (home / os / codes / about); home = hero + terminal, two section cards, recent posts */
:root{
  --bg:#0A0F1F; --panel:#111A31; --panel2:#17213D; --line:#243052;
  --fg:#E9EDF8; --muted:#8C96B3; --volt:#FFD33D; --blue:#5B8CFF; --mint:#6EE7B7; --ink:#0A0F1F;
  --display:"Archivo Black","Arial Black",Impact,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--volt);outline-offset:3px;border-radius:6px}
.bgfx{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(600px 420px at 88% 0%,rgba(91,140,255,.2),transparent 70%),
             radial-gradient(520px 380px at 0% 70%,rgba(255,211,61,.06),transparent 70%)}
.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media(min-width:720px){.wrap{padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(10,15,31,.82);backdrop-filter:blur(12px);border-bottom:1px solid rgba(36,48,82,.6)}
nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:16px}
.logo{display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:18px;letter-spacing:.02em;line-height:1.1}
.mark{width:40px;height:40px;border-radius:11px;background:var(--volt);display:grid;place-items:center;flex:none}
.logo small{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.14em;font-weight:400;margin-top:3px}
.links{display:flex;gap:6px}
.links a{padding:8px 14px;border-radius:999px;color:var(--muted);font-size:15px;transition:color .15s,background .15s}
.links a:hover{color:var(--fg)}
.links a.on{color:var(--fg);background:var(--panel2)}
.ig{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:9px 16px;border-radius:999px;font-size:14px;background:var(--panel);white-space:nowrap}
.ig:hover{border-color:var(--volt)}
.menu-btn{display:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;width:42px;height:42px}
@media(max-width:900px){
  .links{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;background:var(--bg);border-bottom:1px solid var(--line);
    padding:8px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
  .links.open{display:flex}
  .links a{padding:12px 14px}
  .menu-btn{display:grid;place-items:center}
  .ig span{display:none}
}

main{padding-block:0 80px}
.view{animation:in .35s ease both}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.view{animation:none}}

.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center;padding-block:64px 72px}
.hero>*{min-width:0}
@media(max-width:900px){.hero{grid-template-columns:1fr;gap:36px;padding-block:40px 48px}}
.tag{font-family:var(--mono);font-size:13px;color:var(--volt);letter-spacing:.14em}
h1{font-family:var(--display);font-size:clamp(44px,7vw,78px);line-height:1.02;margin:18px 0 22px;font-weight:400;text-wrap:balance}
h1 em{font-style:normal;color:var(--volt)}
.lead{font-size:18px;color:var(--muted);max-width:32em;margin:0}

.term{background:#070B17;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.term .bar{display:flex;gap:7px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);align-items:center}
.dot{width:11px;height:11px;border-radius:50%}
.bar .t{margin-left:10px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.term pre{margin:0;font-family:var(--mono);font-size:14px;line-height:1.85;padding:20px 22px;color:#C9D2EA;overflow-x:auto;min-height:250px}
.c-p{color:var(--volt)}.c-b{color:var(--blue)}.c-m{color:var(--muted)}.c-g{color:var(--mint)}
.cursor{display:inline-block;width:8px;height:17px;background:var(--volt);vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.sec{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:800px){.sec{grid-template-columns:1fr}}
.card{display:block;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:22px;padding:36px;position:relative;overflow:hidden;transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--blue);transform:translateY(-3px)}
.card.code:hover{border-color:var(--volt)}
.ico{width:58px;height:58px;border-radius:15px;display:grid;place-items:center;margin-bottom:24px}
.card h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,3.4vw,36px);margin:0 0 10px;line-height:1.1}
.card p{color:var(--muted);margin:0;max-width:30em}
.go{position:absolute;top:36px;right:36px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:20px;transition:background .2s,color .2s}
.card:hover .go{background:var(--fg);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chip{font-family:var(--mono);font-size:12.5px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--fg)}
button.chip{transition:background .15s,border-color .15s}
button.chip.on{background:var(--volt);color:var(--ink);border-color:var(--volt)}

.head2{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:72px 0 22px}
.head2 h3{font-family:var(--display);font-weight:400;font-size:28px;margin:0}
.head2 a{color:var(--muted);font-size:15px}.head2 a:hover{color:var(--fg)}
.posts{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media(max-width:900px){.posts{grid-template-columns:1fr}}
.post{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--panel);transition:border-color .2s}
.post:hover{border-color:var(--muted)}
.thumb{height:130px;display:flex;align-items:flex-end;padding:16px;font-family:var(--mono);font-size:13px}
.post .b{padding:18px 20px 22px}
.k{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;margin-bottom:8px}
.post h4{font-size:18px;line-height:1.35;font-weight:600;margin:0}
.post .d{color:var(--muted);font-size:13px;margin-top:10px;font-family:var(--mono)}

.page-head{padding-block:56px 32px;max-width:720px}
.page-head h1{font-size:clamp(40px,6vw,64px);margin:14px 0 14px}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:24px}
.search{flex:1 1 260px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;color:var(--fg);font:inherit}
.search::placeholder{color:var(--muted)}
.search:focus{outline:none;border-color:var(--volt)}

.list{display:grid;gap:16px}
.item{border:1px solid var(--line);border-radius:18px;background:var(--panel);overflow:hidden}
.item-h{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 22px;width:100%;background:none;border:0;text-align:left}
.item-h>div{min-width:0}
.item-h h4{margin:4px 0 0;font-size:19px;font-weight:600;line-height:1.35}
.item-h .meta{color:var(--muted);font-size:13px;font-family:var(--mono);margin-top:4px}
.chev{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:transform .2s}
.item.open .chev{transform:rotate(180deg)}
.item-b{padding:0 22px 22px;border-top:1px solid var(--line)}
.item-b>p{color:var(--muted);margin:18px 0 0;max-width:65ch}
.steps{margin:16px 0 0;padding:0;list-style:none;counter-reset:s;display:grid;gap:14px}
.steps li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start}
.steps li>div{min-width:0}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:13px;color:var(--volt)}
.steps b{display:block;font-weight:600}
.steps span{color:var(--muted)}
.warn{margin-top:18px;padding:12px 16px;border-radius:12px;background:rgba(255,211,61,.08);border:1px solid rgba(255,211,61,.3);color:#F5E3A3;font-size:14px}

.codebox{position:relative;margin-top:12px;background:#070B17;border:1px solid var(--line);border-radius:12px}
.codebox pre{margin:0;padding:16px 18px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.7;color:#C9D2EA}
.copy{position:absolute;top:8px;right:8px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 11px;font-size:12px;font-family:var(--mono)}
.copy:hover{border-color:var(--volt)}
.copy.ok{background:var(--mint);color:var(--ink);border-color:var(--mint)}
.empty{color:var(--muted);padding:28px;text-align:center;border:1px dashed var(--line);border-radius:18px}
.note{font-size:13px;color:var(--muted);font-family:var(--mono);margin-top:28px}

.about{display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:start}
.about>*{min-width:0}
@media(max-width:800px){.about{grid-template-columns:1fr}}
.about p{color:var(--muted);font-size:17px;max-width:60ch}
.statbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;display:grid;gap:14px}
.stat{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px;font-family:var(--mono);font-size:14px}
.stat:last-child{border:0;padding:0}
.stat span:first-child{color:var(--muted)}
.cta{display:inline-flex;align-items:center;gap:10px;margin-top:20px;background:var(--volt);color:var(--ink);font-weight:600;padding:14px 22px;border-radius:12px}

.dl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.dl{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;transition:border-color .2s,transform .2s}
.dl:hover{border-color:var(--volt);transform:translateY(-2px)}
.dl .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dl h4{margin:0;font-size:19px;font-weight:600}
.dl p{margin:0;color:var(--muted);font-size:14.5px;flex:1}
.dl .src{font-family:var(--mono);font-size:12px;color:var(--muted)}
.dl .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--volt);color:var(--ink);font-weight:600;padding:11px 16px;border-radius:10px;font-size:15px}
.dl.off{opacity:.7}
.dl.off:hover{border-color:var(--line);transform:none}
.dl .btn.none{background:transparent;border:1px dashed var(--line);color:var(--muted);font-weight:500}
.os-sec{padding-block:8px 8px;scroll-margin-top:90px}
.os-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px}
.os-head h2{font-family:var(--display);font-weight:400;font-size:clamp(32px,4.5vw,46px);margin:8px 0 0;line-height:1.05}
.tabs{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:5px;gap:4px}
.tab{display:flex;align-items:center;gap:8px;background:none;border:0;border-radius:10px;padding:10px 20px;font-weight:600;color:var(--muted);transition:background .15s,color .15s}
.tab:hover{color:var(--fg)}
.tab.on{background:var(--volt);color:var(--ink)}
.tab .n{font-family:var(--mono);font-size:12px;font-weight:500;opacity:.75}
.dl-group{font-family:var(--display);font-weight:400;font-size:24px;margin:40px 0 16px}
.dl-group:first-of-type{margin-top:8px}
footer{position:relative;z-index:1;border-top:1px solid var(--line)}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;padding-block:24px;color:var(--muted);font-size:14px}
</style>
</head>

let pendingOpen=null;
function route(){

  const navV=v==="indirmeler"?"isletim-sistemleri":v;document.querySelectorAll(".links a").forEach(a=>a.classList.toggle("on",a.dataset.v===(views[v]?navV:"ana-sayfa")));
  document.getElementById("links").classList.remove("open");
  if(fn===codePage) renderCodes();
  if(fn===osDl) renderDL();
  if(fn===home) typeTerm();
  if(pendingOpen){const el=document.getElementById("i-"+pendingOpen); if(el){ if(!el.classList.contains("open")) el.querySelector("[data-toggle]").click(); setTimeout(()=>el.scrollIntoView({block:"center"}),60);} pendingOpen=null;}
  else window.scrollTo(0,0);
}

document.addEventListener("click",e=>{
  const open=e.target.closest("[data-open]"); if(open) pendingOpen=open.dataset.open;
  const tg=e.target.closest("[data-toggle]");
  if(tg){const it=tg.closest(".item"),b=it.querySelector(".item-b");const on=!it.classList.contains("open");
    it.classList.toggle("open",on);b.hidden=!on;tg.setAttribute("aria-expanded",on);return;}
  const tb=e.target.closest("[data-tab]");
  if(tb){osTab=tb.dataset.tab;document.querySelectorAll("[data-tab]").forEach(x=>{const on=x===tb;x.classList.toggle("on",on);x.setAttribute("aria-selected",on)});
    document.getElementById("dqWrap").hidden=osTab!=="Linux";renderDL();return;}
  const f=e.target.closest("[data-osf]"); if(f){osFilter=f.dataset.osf;route();return;}
  const c=e.target.closest("[data-cf]"); if(c){codeFilter=c.dataset.cf;
    document.querySelectorAll("[data-cf]").forEach(x=>x.classList.toggle("on",x===c));renderCodes();return;}
  const cp=e.target.closest("[data-copy]");
  if(cp){const pre=cp.parentElement.querySelector("pre");const txt=pre.innerText;
    const done=()=>{cp.textContent="Kopyalandı ✓";cp.classList.add("ok");setTimeout(()=>{cp.textContent="Kopyala";cp.classList.remove("ok")},1600)};
    const fallback=()=>{const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);cp.textContent="Seçildi, kopyala";};
    try{navigator.clipboard.writeText(txt).then(done,fallback);}catch(err){fallback();}
    return;}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){codeQuery=e.target.value;renderCodes();}if(e.target.id==="dq"){dlQuery=e.target.value;renderDL();}});
document.getElementById("menuBtn").addEventListener("click",function(){const l=document.getElementById("links");const o=l.classList.toggle("open");this.setAttribute("aria-expanded",o);});
addEventListener("hashchange",route);
route();
</script>
